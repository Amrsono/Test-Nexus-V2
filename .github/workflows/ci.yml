name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Code Quality & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Lint client
        run: npm run lint --workspace=client

  unit-tests:
    name: Fast Unit Tests (Offline)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci_unit_test_secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Generate Prisma Client (types only)
        run: npx prisma@5.22.0 generate
        working-directory: server
      - name: Run Client & Server Unit Tests
        run: npm test

  integration-tests:
    name: Database Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus_password
          POSTGRES_DB: test_nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://nexus:nexus_password@localhost:5432/test_nexus?schema=public
      JWT_SECRET: ci_test_secret
      NODE_ENV: test
      GEMINI_API_KEY: placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Generate Prisma Client
        run: npx prisma@5.22.0 generate
        working-directory: server
      - name: Run database migrations
        run: npx prisma@5.22.0 migrate deploy
        working-directory: server

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build client assets
        run: npm run build --workspace=client

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Audit for high severity issues
        run: npm audit --audit-level=high

