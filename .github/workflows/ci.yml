name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus_password
          POSTGRES_DB: test_nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://nexus:nexus_password@localhost:5432/test_nexus?schema=public
      JWT_SECRET: ci_test_secret
      NODE_ENV: test
      GEMINI_API_KEY: placeholder

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma@5.22.0 generate
        working-directory: server

      - name: Run database migrations
        run: npx prisma@5.22.0 migrate deploy
        working-directory: server

      - name: Lint (client)
        run: npm run lint --workspace=client

      - name: Run tests
        run: npm test

      - name: Build client
        run: npm run build --workspace=client

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Audit for high severity issues
        run: npm audit --audit-level=high
